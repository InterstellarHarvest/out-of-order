# Temporary validation/build gate for a private Chapter 1 draft. Read-only GitHub token.
# This workflow does not push, publish, or promote content.
name: Chapter 1 draft preview build
on:
  push:
    branches: [agent/ch01-playable-import-20261115]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate authored story source
        run: node tools/story-import/import.js --check
      - name: Generate draft playable game content
        run: node tools/story-import/import.js
      - name: Verify deterministic output
        run: node tools/story-import/import.js --verify
      - name: Output generated game content for PR integration
        run: |
          echo "CYOA_GENERATED_B64_BEGIN"
          base64 -w0 game/content/story.generated.js
          echo
          echo "CYOA_GENERATED_B64_END"
