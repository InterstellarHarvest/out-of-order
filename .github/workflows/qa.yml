# Game QA (docs/84 section 7; minutes policy docs/105). Two jobs:
#   content   Node only, ~5 min: the storyboard import (built + compared with the committed file), the
#             storyboard sync, the glyph ink table, the rules, both route validators, the chapter art and
#             route validators and the static asset checks. The story-import acceptance suite (~15-19 min)
#             runs only when the change can affect the importer (tools/ci/changed-scope.js) and on manual
#             chromium/full runs.
#   browsers  Playwright, headless Linux: every browser suite. AUTOMATIC on non-draft PRs affecting
#             game, story, art, runtime labs or QA; also on release tags (v*) or a PR labeled
#             full-browser-qa. Manual chromium/full runs remain available. Regular main pushes
#             rely on the PR gate instead of paying for a second full browser run.
#             The layout lab's 8 long-standing failures are
#             allowed by exact name only (game/qa/known_failures/layout-lab.json); anything else fails.
#
# When it runs (docs/105; GitHub Actions minutes are not to be spent on routine work):
#   documentation-only change (docs/**, *.md, *.tsv)    nothing
#   draft pull request                                  nothing
#   non-draft routine PR / push to main                 content job (quick)
#   gameplay/art/story PR or PR labeled full-browser-qa both jobs, Chromium + Firefox
#   push of version tag v*                              both jobs, Chromium + Firefox
#   Actions > QA > Run workflow, scope quick            content job (quick)
#   ... scope chromium                                  everything, browsers in Chromium only
#   ... scope full                                      everything, Chromium and Firefox
# The free local gate is tools/ci/run-local-qa.js; browser results must pass before major PR merges.
# CI environment limits are recorded in docs/84 section 7.2 (no Safari/WebKit by owner rule, Linux
# runners only, timing-sensitive checks are the first suspects in a one-off failure).
#
# Artifacts (docs/100). The browser screenshots are about 300 MB per run, so:
#   qa-content                       content-job JSON results          every run       7 days
#   qa-browsers-summary              browser JSON results + index      every run       7 days
#   qa-browsers-failure-screenshots  PNGs of the FAILED suites only    failed run      1 day
#   qa-browsers-screenshots          every PNG of every suite          visual review   1 day
# A manual visual-review run: Actions > QA > Run workflow, choose the branch, scope chromium or full,
# tick visual_review (gh workflow run qa.yml --ref <branch> -f scope=full -f visual_review=true).
# Upload steps are continue-on-error, so a refused upload can neither fail a passing run nor pass a
# failing one.

name: QA

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    # Documentation-only changes run nothing (docs/105).
    paths-ignore: ['docs/**', '**/*.md', '**/*.tsv']
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**/*.md', '**/*.tsv']
  workflow_dispatch:
    inputs:
      visual_review:
        description: 'Keep the full browser screenshots (qa-browsers-screenshots, 1 day) for creative / visual review'
        type: boolean
        default: false
      scope:
        description: 'quick = the content checks only (~5 min); chromium = everything, browsers in Chromium only (~35 min); full = everything in Chromium and Firefox (~65 min)'
        type: choice
        options: [quick, chromium, full]
        default: quick

concurrency:
  group: qa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  content:
    # Draft PRs run nothing (docs/100 section 9, docs/105).
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    outputs:
      browser_full: ${{ steps.scope.outputs.browser_full }}
    # The story-import acceptance suite re-walks every reachable state per case (~15-19 min); it runs when
    # the change can affect the importer (tools/ci/changed-scope.js) and on every manual chromium/full run.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Which expensive checks this change needs (docs/105)
        id: scope
        run: node tools/ci/changed-scope.js "${{ github.event.pull_request.base.sha || github.event.before }}" "${{ github.sha }}"
      # --verify builds story/ (the full import + reachability walk, as --check did) and compares the result
      # with the committed file: a build error or a stale/hand-edited file both fail here.
      - name: Generated story is up to date with story/ (builds it; not stale, not hand-edited)
        run: node tools/story-import/import.js --verify
      - name: story/ is the projection of its pinned canonical storyboard revision (no hand edits, no stray canon)
        run: node tools/story-sync/sync.js verify
      - name: Re-project the pinned revision from the public storyboard and compare byte for byte
        run: node tools/story-sync/sync.js verify --online
      - name: Drift report against public storyboard main (informational; consume with sync.js pull)
        continue-on-error: true
        run: node tools/story-sync/sync.js status
      - name: Story sync self-test (projection, refusals, contract, integration report)
        run: node tools/story-sync/qa-sync.js
      - name: Glyph ink table matches the font atlases
        run: node tools/glyph-ink/build.js --verify
      - name: Route validation (v1 engine)
        run: node game/qa/validate_route.js
      - name: Route validation (v2 engine)
        run: node game/qa/validate_route.js --v2
      - name: Rules (story engine, fixtures, mutants)
        run: node game/qa/validate_story.js
      - name: Story import acceptance (incl. Focus A, dice checks, content independence)
        if: (github.event_name != 'workflow_dispatch' && steps.scope.outputs.story_import == 'true') || (github.event_name == 'workflow_dispatch' && inputs.scope != 'quick')
        run: node game/qa/validate_story_import.js
      - name: Biology Park routes (engine; every Chapter 2 node and check outcome, gating, antidotes)
        run: node game/qa/validate_ch02_routes.js
      - name: Chapter 1 production art (29-image provenance, registry, state-dependent art on real routes)
        run: node game/qa/validate_ch01_art.js
      - name: Chapter 2 production art (50-image provenance, registry, bindings, every real route, deaths; docs/102)
        run: node game/qa/validate_ch02_art.js
      - name: Chapter 3 Pavilion (29-image intake vs approved hashes, narrative fidelity, every route variant from real Chapter 2 endings, items, checks, saves; docs/104)
        run: node game/qa/validate_ch03.js
      - name: Death controls (restore points, attempt-scoped dice, saves; RETRY / CHECKPOINT rules)
        run: node game/qa/validate_death_controls.js
      - name: Assets (static)
        run: node game/qa/validate_assets.js
      - name: CI artifact policy (upload paths match the artifact index; retention and conditions, docs/100)
        run: node tools/ci/check-qa-artifacts.js
      - name: Results
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-content
          retention-days: 7
          path: |
            game/qa/route_results*.json
            game/qa/story_results.json
            game/qa/story_import_results.json
            game/qa/ch02_route_results.json
            game/qa/ch01_art_results.json
            game/qa/ch02_art_results.json
            game/qa/ch03_results.json
            game/qa/death_controls_results.json
            game/qa/asset_results.json
          if-no-files-found: ignore

  browsers:
    # Run both browsers before gameplay-sensitive PR merges, on release tags, or when a PR owner
    # explicitly requests full-browser-qa. Routine main pushes do not duplicate the PR run.
    # Manual chromium/full runs remain available (docs/105).
    needs: content
    if: >-
      (github.event_name == 'pull_request' && !github.event.pull_request.draft &&
       (needs.content.outputs.browser_full == 'true' || contains(github.event.pull_request.labels.*.name, 'full-browser-qa')))
      || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
      || (github.event_name == 'workflow_dispatch' && inputs.scope != 'quick')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PLAYWRIGHT_VERSION: 1.59.1
      QA_BROWSERS: ${{ github.event_name == 'workflow_dispatch' && inputs.scope == 'chromium' && 'chromium' || 'chromium,firefox' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Installed outside the checkout so no node_modules ever lands in the repository; the QA
      # scripts find it through NODE_PATH, as they do locally.
      # Pinned runner: ubuntu-latest moved to 26.04, which Playwright 1.59.1 does not support.
      - name: Install Playwright (the browsers this run uses)
        id: pw
        run: |
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-audit --no-fund "playwright@$PLAYWRIGHT_VERSION"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps ${QA_BROWSERS//,/ }
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Assets (in the browser)
        id: assets_browser
        run: node game/qa/validate_assets.js --browser
      - name: Imported story in the browser (Narrative B, dialogue, Focus A, dice checks, saves, draft stamp)
        id: story
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_story_qa.js
      - name: House of Tomorrow full branch acceptance (actual Prologue inventory, 9 routes in two browsers)
        id: ch01_routes
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_ch01_routes_qa.js
      - name: Chapter 1 production art in the game (album pages, storage, pedestal, RETURNS, House views; pixels vs source; reloads)
        id: ch01_art
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_ch01_art_qa.js
      - name: Rest Assured death presentation proof (feature-gated; geometry, A1 parity, backdrop, isolation, cause selection)
        id: end_presentation
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_end_presentation_qa.js
      - name: Death controls in the game (RETRY / CHECKPOINT / EXIT, reloads, save compatibility, two browsers)
        id: death_controls
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_death_controls_qa.js
      - name: Chapter 2 production art in the game (scenes, conversations, Focus A, items, death popups; pixels vs source; docs/102)
        id: ch02_art
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_ch02_art_qa.js
      - name: Biology Park full routes + Scene Pickup Inspector (House hand-offs, antidote kits, two browsers)
        id: ch02_routes
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_ch02_routes_qa.js
      - name: Chapter 3 Pavilion in the game (Chapter 2 hand-off, every scene + conversation pair pixel-compared, SHOW / USE, dice, incidental voices, '%', reload, endings; docs/104)
        id: ch03
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_ch03_qa.js
      - name: M2 reception game (regression fixture, ?story=reception)
        id: m2_reception
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node game/qa/run_qa.js
      - name: Polish lab
        id: polish_lab
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: node tools/m2-reception-polish-lab/qa/run_qa.js
      - name: Layout lab (only the 8 known failures allowed)
        id: layout_lab
        if: (success() || failure()) && steps.pw.outcome == 'success'
        run: |
          rm -f tools/layout-lab/qa/qa_results.json
          node tools/layout-lab/qa/run_qa.js || true
          node game/qa/check_known_failures.js tools/layout-lab/qa/qa_results.json game/qa/known_failures/layout-lab.json
      # Small JSON results on every run; PNGs only when they are needed (docs/100). The upload steps
      # are continue-on-error: an upload refused by GitHub (for example, storage quota reached) must
      # never turn a passing run red, and cannot turn a failing run green: the job's result comes
      # only from the QA steps above (checked by tools/ci/check-qa-artifacts.js).
      - name: Artifact index (every results file and screenshot of this run; stages the failed suites' screenshots)
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          VISUAL_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.visual_review }}
          STEP_OUTCOMES: ${{ toJSON(steps) }}
        run: node tools/ci/qa-artifact-index.js
      - name: Results summary (every run, 7 days)
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-browsers-summary
          retention-days: 7
          path: |
            game/qa/ci_artifact_index_browsers.json
            game/qa/asset_results.json
            game/qa/story_qa_results.json
            game/qa/ch01_art_qa_results.json
            game/qa/end_presentation_results.json
            game/qa/death_controls_qa_results.json
            game/qa/ch02_art_qa_results.json
            game/qa/ch02_route_results_browser.json
            game/qa/ch03_qa_results.json
            game/qa/qa_results.json
            tools/m2-reception-polish-lab/qa/qa_results.json
            tools/layout-lab/qa/qa_results.json
          if-no-files-found: warn
      - name: Failure screenshots (only the failed suites' folders, 1 day)
        if: ${{ !cancelled() && failure() && !(github.event_name == 'workflow_dispatch' && inputs.visual_review) }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-browsers-failure-screenshots
          retention-days: 1
          # PNGs are already compressed; zipping them again only costs time.
          compression-level: 0
          path: |
            qa-failure-screenshots/**/*.png
          if-no-files-found: warn
      - name: All screenshots (manual visual-review run only, 1 day)
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.visual_review }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: qa-browsers-screenshots
          retention-days: 1
          compression-level: 0
          path: |
            game/qa/screenshots/*.png
            game/qa/story_screenshots/*.png
            game/qa/ch01_route_screenshots/*.png
            game/qa/ch01_art_screenshots/*.png
            game/qa/end_presentation_screenshots/*.png
            game/qa/death_controls_screenshots/*.png
            game/qa/ch02_art_screenshots/*.png
            game/qa/ch02_route_screenshots/*.png
            game/qa/ch03_screenshots/*.png
            tools/m2-reception-polish-lab/qa/screenshots/*.png
            tools/layout-lab/qa/screenshots/*.png
          if-no-files-found: warn
