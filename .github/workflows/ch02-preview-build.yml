name: Chapter 2 draft preview integration (one-time)
on:
  push:
    branches:
      - agent/ch02-biopark-integration-20261115
permissions:
  contents: write
concurrency:
  group: ch02-preview-one-time
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate 3-chapter authored source including all 28 checks
        run: node tools/story-import/import.js --check
      - name: Build Chapter 2 as an unpromoted playable draft
        run: node tools/story-import/import.js
      - name: Verify generated content bytes
        run: node tools/story-import/import.js --verify
      - name: Commit preview build and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/content/story.generated.js
          git rm .github/workflows/ch02-preview-build.yml
          git commit -m "Build 3-chapter Biology Park playable draft preview"
          git push origin HEAD:refs/heads/agent/ch02-biopark-integration-20261115
