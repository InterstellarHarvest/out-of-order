name: Prepare explicitly authorized public prologue artwork transfer
on:
  push:
    branches: [agent/prologue-art-public-export-20261113]
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/prologue-art-public-export-20261113
          fetch-depth: 1
      - name: Encode only selected public art into private text bridge
        shell: bash
        run: |
          python3 - <<'PY'
          import os,json,glob,base64,hashlib
          root='.public-export-b64'
          drafts=sorted(glob.glob('tools/prologue-art-lab/assets/art/**/*.png',recursive=True))
          approved=[
            'art/ui/shell/layout-final.png',
            'art/ui/shell/item-overlay.png',
            'art/ui/sprites/inventory/inventory_slot.png',
            'art/ui/sprites/controls/inv_left_up.png',
            'art/ui/sprites/controls/inv_right_up.png',
            'art/ui/sprites/controls/inv_left_down.png',
            'art/ui/sprites/controls/inv_right_down.png',
            'art/ui/sprites/choice_cards/choice_2line_a.png',
            'art/ui/sprites/controls/utility_a_up.png',
            'art/ui/sprites/controls/utility_b_up.png',
            'art/ui/sprites/controls/utility_c_up.png',
            'art/ui/sprites/inspect_close.png',
            'art/scenes/conference_hall/reception/reception_scene.png',
            'art/portraits/receptionist/reception_background.png',
            'art/portraits/receptionist/receptionist_idle.png',
            'art/items/bathroom_pass_slot.png',
            'art/items/bathroom_pass_inspect.png',
          ]
          assert len(drafts)==28, len(drafts)
          files=drafts+approved
          manifest=[]
          for p in files:
            b=open(p,'rb').read()
            assert b.startswith(b'\x89PNG\r\n\x1a\n'), p
            b64=base64.b64encode(b).decode('ascii')
            chunks=[b64[i:i+350000] for i in range(0,len(b64),350000)]
            for n,chunk in enumerate(chunks):
              name=f'{root}/{p}.part{n:02}.b64'
              os.makedirs(os.path.dirname(name),exist_ok=True)
              open(name,'w').write(chunk+'\n')
            manifest.append(dict(path=p,bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),parts=[f'{root}/{p}.part{n:02}.b64' for n in range(len(chunks))]))
          open(f'{root}/manifest.json','w').write(json.dumps({'schema':'cyoa-public-art-bridge-v1','sourceBranch':'agent/prologue-art-review-lab-20261113','files':manifest},indent=2)+'\n')
          print('Prepared',len(manifest),'PNG files in',sum(len(x['parts']) for x in manifest),'text parts')
          PY
      - name: Commit private bridge (never public source prose)
        shell: bash
        run: |
          git config user.name "GitHub Actions"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .public-export-b64
          git diff --cached --quiet && exit 0
          git commit -m "bridge: encode limited public artwork package for connector transfer"
          git push origin HEAD:agent/prologue-art-public-export-20261113
